version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    open-pull-requests-limit: 10
    versioning-strategy: 'auto'
    allow:
      - dependency-type: 'all'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'automerge'
    ignore:
      # typescript-eslint peers on typescript <6.1.0, so TS 7 breaks lint and the
      # vitest tree. Drop this once typescript-eslint supports it.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
    # Grouping is by dependency-type rather than a hand-maintained pattern list so
    # nothing falls through into its own PR. Every PR touches package-lock.json, and
    # main requires branches be up to date, so N open PRs cost O(N^2) rebases.
    #
    # Majors are excluded: a grouped PR reports the highest update-type in the batch,
    # and one major would block auto-merge for the whole group. They arrive ungrouped
    # instead, so each can be reviewed or closed on its own.
    groups:
      dev-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
      runtime-dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
